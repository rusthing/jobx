[web]
port = 9001

# 僵尸任务巡检：把「服务端已建单、执行器再也不会来上报」的记录收敛成失败。
# 执行器优雅停机是第一道防线（秒级），这里是 SIGKILL/OOM/掉电时的兜底（分钟级）。
# 阈值都按「宁可晚回收，也不要误杀正在跑的任务」来定：被误判的任务跑完后仍会
# 正常上报、把状态改回真实结果。
#[jobx-task-reaper]
#enabled = true
#scan-interval = "60s"
# 「已分派但还没开始执行」的宽限期（要大于 发布提前量 + assign-lead 之和）
#start-grace = "5min"
# 「已开始执行但没结束」的超时（按最长执行时间的数倍设）
#exec-timeout = "30min"
# 高频任务单独一档，它本来就长时间连续执行
#high-freq-exec-timeout = "6h"

# 调度器：next_assign_ms 的推进是开环的（起点取旧值、不对齐墙钟），所以滞后不会自愈。
# 发布窗口的下界是 query-start-earlier-duration（默认 3 天），滞后一旦超过它，
# 计划就再也落不进窗口 —— 静默停摆。max-assign-lag-duration 把「停摆」变成
# 「拉回当前时间 + 告警」：滞后超过这个值的计划，next_assign_ms 直接改成 now。
# 它同时决定「停机多久之内还保留补拍语义」，必须小于 query-start-earlier-duration。
#[jobx-scheduler]
#scan-interval = "60s"
#query-start-earlier-duration = "72h"
#query-end-later-duration = "60s"
#assign-lead-duration = "60s"
#high-freq-threshold-duration = "60s"
#high-freq-assign-interval = "5min"
#max-assign-lag-duration = "60m"
#publish-max-retries = 5
#publish-retry-interval = "8s"
#stream-max-len = 10000

[micro-svc.consul]
base-url = "http://consul:8500"
[micro-svc.consul.config]
common-configs = ["redis.toml"]
