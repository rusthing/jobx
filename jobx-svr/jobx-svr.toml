profile = "dev"

[log]
level = "debug"
[log.modules]
"h2::codec" = "info"
"h2::proto" = "info"
"tower::buffer" = "info"
"hyper_util::client" = "info"

[micro-svc.consul]
base-url = "http://consul:8500"
config.file-format = "toml"
config.common-configs = "log.toml"
[micro-svc.consul.registry]
sub-net = "192.168.1.0/24"

[jobx]
scheduler-workers = 4
task-timeout-seconds = 3600
max-retry-count = 3

[db]
url = "postgres://jobx:jobx@pgsql:5432/jobx"
